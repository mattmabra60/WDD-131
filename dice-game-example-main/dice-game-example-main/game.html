<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="game.js" defer></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        img {
            height: 50px;
        }   

        /* color stuffs */
        #colorPicker {
            margin-top: 200px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #colorPicker label {
            font-weight: bold;
            font-size: 30px;
            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        #color {
            appearance: none;
            background-color: white;
            color: black;
            font-size: 1rem;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            padding: 10px 36px 10px 14px;
            border: 2px solid black;
            border-radius: 5px;
            box-shadow: 0 3px black;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        #color:active {
            transform: translateY(2px);
            box-shadow: 0 1px black;
        }

        #gameboard {
            margin-top: 100px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
        }

        #rollButton {
            margin-top: 20px;
            background-color: white;
            color: black;
            padding: 12px 24px;
            border: 2px solid black;
            border-radius: 5px;
            box-shadow: 0 3px black;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        #rollButton:active {
            transform: translateY(4px);
            box-shadow: 0 1px black;
        }

        /* I'm not gonna lie this was kinda fun to add */
        #rollButton.all-held {
            transform: none;
            color: red;
            border-color: red;
            box-shadow: 0 3px red;
        }

        #rollButton.shake {
            animation: shake 1s;
        }

        /* yeah this is really cool */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            0%, 100% { transform: translatey(0); }
            20%      { transform: translatey(-20px); }
            40%      { transform: translatey(20px); }
            60%      { transform: translateX(-10px); }
            80%      { transform: translateX(10px); }
        }

        input[type="checkbox"] {
            accent-color: black;
        }
    </style>
</head>
<body>
    <!-- this be for the drop down menu colors -->
    <div id="colorPicker">
        <label for="color">Dice color</label>
            <select id="color" name="dieColor">
                <option value="white">White</option>
                <option value="white_alt">White (alt)</option>
                <option value="white_shadow">White (shadow)</option>
                <option value="grey">Grey</option>
                <option value="red">Red</option>
                <option value="orange">Orange</option>
                <option value="yellow">Yellow</option>
                <option value="lime">Lime</option>
                <option value="green">Green</option>
                <option value="cyan">Cyan</option>
                <option value="cyan_alt">Cyan (alt)</option>
                <option value="blue">Blue</option>
                <option value="purple">Purple</option>
                <option value="pink">Pink</option>
                <option value="hot_pink">Hot pink</option>
            </select>
    </div>
    <div id="gameboard">
        <img class="dice1" src="assets/white_dice_1.gif">
        <img class="dice2" src="assets/white_dice_2.gif">
        <img class="dice3" src="assets/white_dice_3.gif">
        <img class="dice4" src="assets/white_dice_4.gif">
        <img class="dice5" src="assets/white_dice_5.gif">
        <input type="checkbox" class="dice1" value="1">
        <input type="checkbox" class="dice2" value="2">
        <input type="checkbox" class="dice3" value="3">
        <input type="checkbox" class="dice4" value="4">
        <input type="checkbox" class="dice5" value="5">
    </div>
    <button id="rollButton">Roll!</button>
</body>
</html>
